version: "v0.4"
project:
  name: "Uniform Minor-Arc Cancellation for Primes at the X^{2/15+ε} Scale"
  description: >-
    We prove uniform cancellation in prime-weighted exponential sums at the
    2/15 scale, improving the 8/33 local Fourier scale in the
    Matomäki–Radziwiłł–Tao machinery for averaged prime-pair correlations.
    On the minor-arc part of every centered arc of radius 1/(2H), the squared
    von Mangoldt exponential sum over X < n <= 2X has integral at most
    C X (log X)^(-A), for every A > 0 and epsilon > 0, once H >= X^(2/15+epsilon) and X is
    large enough. The center may lie anywhere on the circle.
    The same cutoffs and constants work for every center and are chosen before
    X and H. This gives uniform minor-arc cancellation at the 2/15 threshold.
    Since 2/15 < 8/33, the admissible H is
    smaller, so the frequency windows of length 1/H are wider and the
    shift-averaging intervals are shorter. The constants C and X0 are ineffective
    because the proof uses Siegel's theorem. The development also contains an
    internal proof of the epsilon-form of Guth–Maynard's large-value estimate
    for Dirichlet polynomials. The recorded 20 September Lean 4.30 kernel
    replays checked 100,596 declarations for MAP and 75,874 for Guth–Maynard,
    using only standard axioms. The formal statement is
    AllCenterMAP.map_two_fifteenths, manuscript Theorem 1.1.
  authors: ["Conor Grogan"]
  license: "Apache-2.0"
  responsible_maintainers: ["Conor Grogan"]
