name: Palomar release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm the checkout is a clean pinned commit
        run: |
          git rev-parse HEAD
          git status --porcelain
          python3 scripts/check-release-gate.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Install pinned Comparator sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/PalomarRegistry/PalomarSubmission/1703d7babd984ccc3831cdf89c28221abe34808f/scripts/install_bwrap.sh \
            --output "$RUNNER_TEMP/install_bwrap.sh"
          echo "c290df6cebdf1cb26edb69ed4164d9551062bfeb65243b93d1d1d3b77eac0a35  $RUNNER_TEMP/install_bwrap.sh" | sha256sum --check
          echo "COMPARATOR_BWRAP=$(bash "$RUNNER_TEMP/install_bwrap.sh" "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Replay Linux verification
        run: ./scripts/verify-linux.sh --ci

  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@1703d7babd984ccc3831cdf89c28221abe34808f
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 1703d7babd984ccc3831cdf89c28221abe34808f
      request_id: map435preflight
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
