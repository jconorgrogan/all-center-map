version: "v0.4"
project:
  name: "All-center local minor-arc estimate at exponent 2/15"
  description: >-
    A Lean proof of the all-center local minor-arc estimate for the von Mangoldt
    exponential sum over X < n <= 2X. For every positive A and epsilon, fixed
    positive integer logarithmic major-arc cutoffs and constants bound the
    normalized Haar mass on the minor-arc part of every centered circle arc of
    radius 1/(2H) by C X (log X)^(-A), uniformly when H >= X^(2/15+epsilon) and
    X is sufficiently large. The cutoffs and constants precede X, H, and the
    center. A substantial reusable component is an internal proof of the
    epsilon-form of Guth–Maynard's Theorem 1.1 on Dirichlet-polynomial large
    values, derived from proved local estimates rather than assumed as a
    Guth–Maynard premise. Its own 75,874-declaration dependency closure passed
    fresh Lean kernel replay with only standard axioms. The sole recorded target is AllCenterMAP.map_two_fifteenths,
    manuscript Theorem 1.1. Independent release verification remains pending.
  authors: ["Conor Grogan"]
  license: "Apache-2.0"
  responsible_maintainers: ["Conor Grogan"]
classification:
  arxiv: ["math.NT"]
  msc2020: ["11N37"]
sources:
  - title: >-
      Prime Pairs at the Prime Number Theorem Threshold: Hardy--Littlewood for
      Almost Every Shift in Every Interval of Length X^(2/15+epsilon)
    type: "original-proof"
    authors: ["Conor Grogan"]
    relationship: "other"
    note: >-
