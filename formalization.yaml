    rational logarithmic major arcs, normalized circle Haar measure, positive
    natural cutoff exponents, and all-center quantifiers. The exact endpoint
    was compared to the manuscript statement during internal review. Comparator
    identity and independent kernel verification of the release are recorded in
    VERIFICATION.md.
